<style>
:root{
  --navy:#0A1628;--navy-mid:#1B3A6B;--card:#162040;--deep:#0d1e3a;
  --gold:#D4A017;--gold-light:#E8B820;--green:#1a7a4a;--green-light:#5DCAA5;
  --red:#C0392B;--red-light:#E88080;--warn:#E8A020;
  --gray:#8A9BB0;--gray-light:#B0C0D0;--cream:#F5F0E8;--border:#1e3060;--text:#c8d8e8;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{font-family:'DM Sans',sans-serif;background:var(--navy);color:var(--cream);min-height:100vh;}

.header{background:var(--navy);padding:13px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--gold);position:sticky;top:0;z-index:500;}
.hdr-l h1{font-family:'Bebas Neue',sans-serif;font-size:19px;color:white;letter-spacing:2px;line-height:1;}
.hdr-l h1 span{color:var(--gold);}
.hdr-l p{font-size:9px;color:var(--gray);letter-spacing:1px;text-transform:uppercase;margin-top:2px;}
.hdr-r a{font-family:'Bebas Neue',sans-serif;font-size:12px;color:var(--gold);letter-spacing:1px;text-decoration:none;}

.tool-nav{background:var(--deep);padding:8px 16px;display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--border);}
.tool-nav::-webkit-scrollbar{display:none;}
.tn-pill{font-family:'Bebas Neue',sans-serif;font-size:11px;letter-spacing:1px;padding:5px 12px;border-radius:20px;border:1px solid #3a5a9a;color:var(--gray-light);text-decoration:none;white-space:nowrap;transition:all .15s;}
.tn-pill:hover{border-color:var(--gold);color:var(--gold);}
.tn-pill.active{background:var(--gold);color:var(--navy);border-color:var(--gold);}

.wrap{max-width:700px;margin:0 auto;padding:20px 16px 60px;}

/* PROPERTY INPUTS */
.props-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;}
.prop-card{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:14px;}
.pc-label{font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:1.5px;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.p1 .pc-label{color:var(--gold);}
.p2 .pc-label{color:var(--green-light);}
.pc-num{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;}
.p1 .pc-num{background:var(--gold);color:var(--navy);}
.p2 .pc-num{background:var(--green-light);color:var(--navy);}

.field{margin-bottom:10px;}
.field:last-child{margin-bottom:0;}
.field label{display:block;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--gray-light);margin-bottom:4px;}
.field select,.field input{width:100%;padding:8px 10px;background:var(--deep);border:1.5px solid #3a5a9a;border-radius:3px;font-family:'DM Sans',sans-serif;font-size:13px;color:white;}
.field select:focus,.field input:focus{outline:none;border-color:var(--gold);}
.field select option{background:var(--navy);}
.field input::placeholder{color:#5a7a9a;}

/* Settings bar */
.settings-bar{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:12px 14px;margin-bottom:16px;}
.sb-title{font-family:'Bebas Neue',sans-serif;font-size:12px;letter-spacing:1.5px;color:var(--gray-light);margin-bottom:10px;}
.sb-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.sb-field label{display:block;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--gray-light);margin-bottom:4px;}
.sb-field input,.sb-field select{width:100%;padding:7px 10px;background:var(--deep);border:1.5px solid #3a5a9a;border-radius:3px;font-family:'DM Sans',sans-serif;font-size:13px;color:white;}
.sb-field input:focus{outline:none;border-color:var(--gold);}

.btn-compare{width:100%;padding:13px;background:var(--gold);border:none;border-radius:4px;font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:2px;color:var(--navy);cursor:pointer;margin-bottom:20px;transition:all .15s;}
.btn-compare:hover{background:var(--gold-light);}

/* COMPARISON TABLE */
.comparison-table{background:var(--card);border:1px solid var(--border);border-radius:6px;overflow:hidden;margin-bottom:16px;}
.ct-header{display:grid;grid-template-columns:1.4fr 1fr 1fr;background:var(--deep);border-bottom:2px solid var(--border);}
.cth-cell{padding:10px 12px;font-family:'Bebas Neue',sans-serif;font-size:12px;letter-spacing:1px;}
.cth-cell:first-child{color:var(--gray-light);}
.cth-p1{color:var(--gold);}
.cth-p2{color:var(--green-light);}

.ct-section-hdr{background:rgba(0,0,0,.2);padding:7px 12px;font-family:'Bebas Neue',sans-serif;font-size:10px;letter-spacing:1.5px;color:var(--gray);border-top:1px solid var(--border);}
.ct-row{display:grid;grid-template-columns:1.4fr 1fr 1fr;border-bottom:1px solid var(--border);}
.ct-row:last-child{border-bottom:none;}
.ctc{padding:9px 12px;font-size:12px;}
.ctc:first-child{color:var(--text);}
.ctc-val{font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:.3px;color:white;}
.ctc-val.gold{color:var(--gold);}
.ctc-val.green{color:var(--green-light);}
.ctc-val.warn{color:var(--warn);}
.ctc-val.red{color:var(--red-light);}
.ctc.winner{background:rgba(93,202,165,.05);}
.winner-dot{width:6px;height:6px;border-radius:50%;background:var(--green-light);display:inline-block;margin-left:6px;vertical-align:middle;}

/* VERDICT */
.verdict{border-radius:6px;padding:14px 16px;margin-bottom:16px;border-left:4px solid;}
.v-better{background:rgba(93,202,165,.06);border-color:var(--green-light);}
.v-even{background:rgba(212,160,23,.06);border-color:var(--gold);}
.v-label{font-family:'Bebas Neue',sans-serif;font-size:10px;letter-spacing:1.5px;color:var(--gray-light);margin-bottom:4px;}
.v-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px;margin-bottom:6px;}
.v-text{font-size:12px;color:var(--text);line-height:1.7;}

/* CTA */
.cta-box{background:var(--card);border:2px solid var(--gold);border-radius:6px;padding:14px;text-align:center;margin-bottom:16px;}
.cta-box h3{font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:1.5px;color:white;margin-bottom:4px;}
.cta-box p{font-size:11px;color:var(--gray-light);line-height:1.5;margin-bottom:10px;}
.btn-call{display:block;background:var(--gold);border:none;padding:12px;width:100%;border-radius:4px;font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:2px;color:var(--navy);cursor:pointer;text-decoration:none;text-align:center;transition:all .15s;}
.btn-call:hover{background:var(--gold-light);}

.footer{background:var(--card);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--border);flex-wrap:wrap;gap:8px;}
.footer p{font-size:10px;color:var(--gray);}
.footer a{color:var(--gold);text-decoration:none;}

@media(max-width:520px){
  .props-grid{grid-template-columns:1fr;}
  .sb-row{grid-template-columns:1fr 1fr;}
  .ct-header,.ct-row{grid-template-columns:1.2fr 1fr 1fr;}
  .ctc{padding:7px 8px;}
}
</style>
</head>

  <div class="hdr-l">
    <h1>COMPARE <span>PROPERTIES</span></h1>
    <p>St. Louis Buyer Guide · George Kindler</p>
  </div>
  <div class="hdr-r"><a href="tel:3144351087">📞 314.435.1087</a></div>
</header>

<nav class="tool-nav">
  <a class="tn-pill" href="prep.html">🏚 PREP</a>

<div class="wrap">

  <!-- PROPERTY INPUTS -->
  <div class="props-grid">
    <!-- Property 1 -->
    <div class="prop-card p1">
      <div class="pc-label"><div class="pc-num">1</div>PROPERTY 1</div>
      <div class="field">
        <label>Zip Code</label>

          <option value="">— Select —</option>

      </div>

        <select id="p1-cond" onchange="onCondChange(1)">
          <option value="">— Select —</option>

          <option value="mid">Mid-Tier</option>

      </div>

    <!-- Property 2 -->
    <div class="prop-card p2">
      <div class="pc-label"><div class="pc-num">2</div>PROPERTY 2</div>
      <div class="field">
        <label>Zip Code</label>
        <select id="p2-zip" onchange="onZipChange(2)">
          <option value="">— Select —</option>
        </select>
      </div>
      <div class="field">
        <label>Sale Price ($)</label>
        <input type="number" id="p2-price" placeholder="e.g. 299000" min="50000" step="5000" oninput="clearResult()">
      </div>
      <div class="field">
        <label>Condition</label>
        <select id="p2-cond" onchange="onCondChange(2)">
          <option value="">— Select —</option>
          <option value="aisis">As-Is</option>
          <option value="mid">Mid-Tier</option>
          <option value="move">Move-In Ready</option>
        </select>
      </div>
      <div class="field">
        <label>Address / Note (optional)</label>
        <input type="text" id="p2-addr" placeholder="456 Oak Ave...">
      </div>
    </div>
  </div>

  <!-- LOAN SETTINGS -->
  <div class="settings-bar">
    <div class="sb-title">LOAN ASSUMPTIONS</div>

      <div class="sb-field">

  <div id="compare-results"></div>

<script>
// ── POPULATE ZIP DROPDOWNS ────────────────────────────────────────
(function(){
  const opts=Object.entries(ZIP_DATA)
    .sort(([,a],[,b])=>a.city<b.city?-1:a.city>b.city?1:0)
    .map(([zip,d])=>`<option value="${zip}">${zip} — ${d.city}</option>`)
    .join('');
  document.getElementById('p1-zip').innerHTML='<option value="">— Select —</option>'+opts;
  document.getElementById('p2-zip').innerHTML='<option value="">— Select —</option>'+opts;
})();

// Auto-fill from URL params (passed from prep.html)
window.addEventListener('DOMContentLoaded',()=>{
  const z1=getParam('zip1'), pr1=getParam('price1'), c1=getParam('city1');
  const z2=getParam('zip2'), pr2=getParam('price2');
  if(z1&&ZIP_DATA[z1]){
    document.getElementById('p1-zip').value=z1;
    if(pr1) document.getElementById('p1-price').value=pr1;
  }
  if(z2&&ZIP_DATA[z2]){
    document.getElementById('p2-zip').value=z2;
    if(pr2) document.getElementById('p2-price').value=pr2;
  }
  if(z1&&z2) compare();
});

function onZipChange(n){
  const zip=document.getElementById('p'+n+'-zip').value;
  if(!zip) return;
  const d=ZIP_DATA[zip];
  // Auto-fill median price if none set
  const priceEl=document.getElementById('p'+n+'-price');
  if(!priceEl.value) priceEl.value=d.price;
  clearResult();
}

function onCondChange(n){
  const zip=document.getElementById('p'+n+'-zip').value;
  const cond=document.getElementById('p'+n+'-cond').value;
  if(!zip||!cond) return;
  const d=ZIP_DATA[zip];
  document.getElementById('p'+n+'-price').value=getTierPrice(d,cond);
  clearResult();
}

function clearResult(){
  document.getElementById('compare-results').innerHTML='';
}

// ── COMPARE ───────────────────────────────────────────────────────
function compare(){
  const z1=document.getElementById('p1-zip').value;
  const z2=document.getElementById('p2-zip').value;
  const pr1=parseFloat(document.getElementById('p1-price').value)||0;
  const pr2=parseFloat(document.getElementById('p2-price').value)||0;

  if(!z1||!z2){alert('Select a zip code for both properties.');return;}
  if(!pr1||!pr2){alert('Enter a sale price for both properties.');return;}

  const d1=ZIP_DATA[z1], d2=ZIP_DATA[z2];
  const down=parseFloat(document.getElementById('down').value)||15000;
  const rate=parseFloat(document.getElementById('rate').value)||6.75;
  const debts=parseFloat(document.getElementById('debts').value)||0;

  const m1=calcTrueMonthly(pr1,down,rate,z1);
  const m2=calcTrueMonthly(pr2,down,rate,z2);

  const addr1=document.getElementById('p1-addr').value.trim()||z1+' — '+d1.city;
  const addr2=document.getElementById('p2-addr').value.trim()||z2+' — '+d2.city;

  // ── WINNER LOGIC ──
  // Lower monthly cost wins on affordability
  // Higher FW rate = more competitive = harder for buyer
  // Lower DOM = faster moving = harder for buyer
  let p1wins=0, p2wins=0;
  if(m1.total<m2.total) p1wins++; else if(m2.total<m1.total) p2wins++;
  if(d1.fw<d2.fw) p1wins++; else if(d2.fw<d1.fw) p2wins++;     // lower FW = more buyer leverage
  if(m1.tax<m2.tax) p1wins++; else if(m2.tax<m1.tax) p2wins++; // lower tax = better
  if(pr1<pr2) p1wins++; else if(pr2<pr1) p2wins++;              // lower price = better

  const winner=p1wins>p2wins?1:p2wins>p1wins?2:0;
  const priceDiff=Math.abs(m1.total-m2.total);
  const annualDiff=priceDiff*12;

  const win=(v1,v2,lowerBetter=true)=>{
    if(v1===v2) return{c1:'',c2:''};
    const p1better=lowerBetter?(v1<v2):(v1>v2);
    return p1better?{c1:' winner',c2:''}:{c1:'',c2:' winner'};
  };

  const wTotal=win(m1.total,m2.total);
  const wFW=win(d1.fw,d2.fw); // lower = better for buyer
  const wDOM=win(d1.dom,d2.dom);
  const wTax=win(m1.tax,m2.tax);
  const wAbove=win(d1.above,d2.above);
  const wPrice=win(pr1,pr2);

  const dot='<span class="winner-dot"></span>';

  // Verdict text
  let verdictTitle='', verdictText='', verdictCls='v-even';
  if(winner===1){
    verdictCls='v-better';
    verdictTitle=`PROPERTY 1 WINS`;
    verdictText=`Property 1 at ${fmt$(m1.total)}/month is <strong>${fmt$(priceDiff)}/month cheaper</strong> than Property 2 — that's <strong>${fmt$(annualDiff)}/year</strong>. Over a 30-year mortgage the difference is <strong>${fmt$(annualDiff*30)}</strong>. ${d1.fw<d2.fw?'Property 1 is also in a less competitive market, giving you more negotiating room.':''}`;
  } else if(winner===2){
    verdictCls='v-better';
    verdictTitle=`PROPERTY 2 WINS`;
    verdictText=`Property 2 at ${fmt$(m2.total)}/month is <strong>${fmt$(priceDiff)}/month cheaper</strong> than Property 1 — that's <strong>${fmt$(annualDiff)}/year</strong>. Over a 30-year mortgage the difference is <strong>${fmt$(annualDiff*30)}</strong>. ${d2.fw<d1.fw?'Property 2 is also in a less competitive market, giving you more negotiating room.':''}`;
  } else {
    verdictTitle='CLOSE CALL';
    verdictText=`These two properties are closely matched. The monthly difference is only ${fmt$(priceDiff)}. At this point the decision comes down to condition, schools, and your personal read on the neighborhoods. George can help you weigh the factors that the numbers don't capture.`;
  }

  document.getElementById('compare-results').innerHTML=`

    <!-- VERDICT -->
    <div class="verdict ${verdictCls}">
      <div class="v-label">COMPARISON RESULT</div>
      <div class="v-title" style="color:${winner===0?'var(--gold)':'var(--green-light)'};">${verdictTitle}</div>
      <div class="v-text">${verdictText}</div>
    </div>

    <!-- COMPARISON TABLE -->
    <div class="comparison-table">
      <div class="ct-header">
        <div class="cth-cell">METRIC</div>
        <div class="cth-cell cth-p1">① ${d1.city}</div>
        <div class="cth-cell cth-p2">② ${d2.city}</div>
      </div>

      <div class="ct-section-hdr">PRICE & MONTHLY COST</div>
      <div class="ct-row">
        <div class="ctc">Sale Price</div>
        <div class="ctc${wPrice.c1}"><div class="ctc-val gold">${fmt$(pr1)}${wPrice.c1?dot:''}</div></div>
        <div class="ctc${wPrice.c2}"><div class="ctc-val gold">${fmt$(pr2)}${wPrice.c2?dot:''}</div></div>
      </div>
      <div class="ct-row">
        <div class="ctc">P&I /mo</div>
        <div class="ctc"><div class="ctc-val">${fmt$(m1.pi)}</div></div>
        <div class="ctc"><div class="ctc-val">${fmt$(m2.pi)}</div></div>
      </div>
      <div class="ct-row">
        <div class="ctc">Tax /mo</div>
        <div class="ctc${wTax.c1}"><div class="ctc-val${wTax.c1?' green':' warn'}">${fmt$(m1.tax)}${wTax.c1?dot:''}</div></div>
        <div class="ctc${wTax.c2}"><div class="ctc-val${wTax.c2?' green':' warn'}">${fmt$(m2.tax)}${wTax.c2?dot:''}</div></div>
      </div>
      <div class="ct-row">
        <div class="ctc">Insurance /mo</div>
        <div class="ctc"><div class="ctc-val">${fmt$(m1.ins)}</div></div>
        <div class="ctc"><div class="ctc-val">${fmt$(m2.ins)}</div></div>
      </div>
      ${down/pr1<0.20||down/pr2<0.20?`
      <div class="ct-row">
        <div class="ctc">PMI /mo</div>
        <div class="ctc"><div class="ctc-val">${fmt$(m1.pmi)}</div></div>
        <div class="ctc"><div class="ctc-val">${fmt$(m2.pmi)}</div></div>
      </div>`:''}
      <div class="ct-row">
        <div class="ctc" style="font-weight:600;color:white;">ALL-IN /mo</div>
        <div class="ctc${wTotal.c1}"><div class="ctc-val" style="font-size:16px;color:${m1.total<m2.total?'var(--green-light)':m1.total===m2.total?'white':'var(--warn)'};">${fmt$(m1.total)}${wTotal.c1?dot:''}</div></div>
        <div class="ctc${wTotal.c2}"><div class="ctc-val" style="font-size:16px;color:${m2.total<m1.total?'var(--green-light)':m1.total===m2.total?'white':'var(--warn)'};">${fmt$(m2.total)}${wTotal.c2?dot:''}</div></div>
      </div>

      <div class="ct-section-hdr">MARKET COMPETITION</div>
      <div class="ct-row">
        <div class="ctc">First Weekend Rate</div>
        <div class="ctc${wFW.c1}"><div class="ctc-val ${d1.fw>=50?'green':d1.fw>=35?'gold':'red'}">${d1.fw}%${wFW.c1?dot:''}</div></div>
        <div class="ctc${wFW.c2}"><div class="ctc-val ${d2.fw>=50?'green':d2.fw>=35?'gold':'red'}">${d2.fw}%${wFW.c2?dot:''}</div></div>
      </div>
      <div class="ct-row">
        <div class="ctc">Avg Days on Market</div>
        <div class="ctc${wDOM.c1}"><div class="ctc-val">${d1.dom}d${wDOM.c1?dot:''}</div></div>
        <div class="ctc${wDOM.c2}"><div class="ctc-val">${d2.dom}d${wDOM.c2?dot:''}</div></div>
      </div>
      <div class="ct-row">
        <div class="ctc">% Sold Above List</div>
        <div class="ctc${wAbove.c2}"><div class="ctc-val">${d1.above}%</div></div>
        <div class="ctc${wAbove.c1}"><div class="ctc-val">${d2.above}%</div></div>
      </div>
      <div class="ct-row">
        <div class="ctc">Median Sale/List</div>
        <div class="ctc"><div class="ctc-val">${d1.splp}%</div></div>
        <div class="ctc"><div class="ctc-val">${d2.splp}%</div></div>
      </div>

      <div class="ct-section-hdr">TAX & SCHOOL</div>
      <div class="ct-row">
        <div class="ctc">Tax Rate</div>
        <div class="ctc${wTax.c1}"><div class="ctc-val">${((ZIP_TAX[z1]||0.0114)*100).toFixed(2)}%${wTax.c1?dot:''}</div></div>
        <div class="ctc${wTax.c2}"><div class="ctc-val">${((ZIP_TAX[z2]||0.0114)*100).toFixed(2)}%${wTax.c2?dot:''}</div></div>
      </div>
      <div class="ct-row">
        <div class="ctc">County</div>
        <div class="ctc"><div class="ctc-val" style="font-size:11px;">${ZIP_COUNTY[z1]||'—'}</div></div>
        <div class="ctc"><div class="ctc-val" style="font-size:11px;">${ZIP_COUNTY[z2]||'—'}</div></div>
      </div>
      <div class="ct-row">
        <div class="ctc">School District</div>
        <div class="ctc"><div class="ctc-val" style="font-size:10px;color:var(--gray-light);">${ZIP_DISTRICT[z1]||'—'}</div></div>
        <div class="ctc"><div class="ctc-val" style="font-size:10px;color:var(--gray-light);">${ZIP_DISTRICT[z2]||'—'}</div></div>
      </div>

      <div class="ct-section-hdr">30-YEAR PERSPECTIVE</div>
      <div class="ct-row">
        <div class="ctc">Monthly difference</div>
        <div class="ctc" style="grid-column:2/4;padding:9px 12px;">
          <div class="ctc-val" style="color:${priceDiff>200?'var(--green-light)':'var(--gold)'};">
            ${fmt$(priceDiff)}/mo · ${fmt$(annualDiff)}/yr · ${fmt$(annualDiff*30)} over loan
          </div>
        </div>
      </div>
    </div>

    <!-- CTA -->
    <div class="cta-box">
      <h3>WANT GEORGE TO WALK BOTH PROPERTIES?</h3>
      <p>13 years and 3,000+ walkthroughs in St. Louis. He can tell you which one the numbers actually favor — and what the comparison table can't capture.</p>
      <a href="tel:3144351087" class="btn-call">📞 CALL 314.435.1087</a>
    </div>
    <p style="font-size:10px;color:var(--gray);text-align:center;line-height:1.6;">Data: 2025 MARIS MLS · George Kindler · The Closing Pros LLC · Licensed Missouri Real Estate Agent. Monthly cost estimates use ${(down/1000).toFixed(0)}K down at ${rate}% — adjust settings above for your actual numbers.</p>
  `;

  gaEvent('compare_run',{zip1:z1,zip2:z2,price1:pr1,price2:pr2,winner});
}
